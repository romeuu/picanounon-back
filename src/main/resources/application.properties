spring.config.import=optional:file:.env[.properties]
spring.application.name=picanounon-back

# Server Port
server.port=8080

# Database Configuration (SQLite)
spring.datasource.url=jdbc:sqlite:picanounon.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Tides Configuration
app.tides.watch-dir=data/mareas

# Open-Meteo Configuration
app.open-meteo.marine-url=https://marine-api.open-meteo.com/v1/marine
app.open-meteo.weather-url=https://api.open-meteo.com/v1/forecast

# Cache Configuration (Caffeine)
app.cache.weather.ttl-hours=3
app.cache.weather.max-size=2000

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Google Authentication
app.google.client-id=${GOOGLE_CLIENT_ID}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
